# Production uses the same environment-driven MySQL settings as the base profile.
spring.jpa.hibernate.ddl-auto=validate
spring.thymeleaf.cache=true
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# New databases receive the initial schema. Existing non-empty schemas are
# baselined and validated without applying the initial create-table migration.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing GigWork schema before versioned migrations

# Do not send exception details to browser responses.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# The production profile assumes HTTPS is terminated by the app or trusted proxy.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.forward-headers-strategy=framework
