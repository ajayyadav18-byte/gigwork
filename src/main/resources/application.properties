spring.application.name=GigWork

# MySQL database connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gigwork_db}
spring.datasource.username=${DB_USERNAME:gigwork_user}
spring.datasource.password=${DB_PASSWORD}

# Local development keeps the existing Hibernate-managed schema. Production
# enables versioned Flyway migrations in application-prod.properties.
spring.flyway.enabled=${FLYWAY_ENABLED:false}

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Website settings
server.port=${PORT:8080}
spring.thymeleaf.cache=false
